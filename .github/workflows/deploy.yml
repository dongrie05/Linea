name: GitHub Pages redirect

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # O site da Linea vive em https://linea.dongrielabs.com (Vercel).
      # A cópia antiga em dongrie05.github.io/Linea passa a só reencaminhar
      # para lá, mantendo a página e a âncora.
      - name: Build redirect to linea.dongrielabs.com
        run: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-PT">
          <head>
          <meta charset="utf-8">
          <title>Linea</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://linea.dongrielabs.com/">
          <meta http-equiv="refresh" content="0; url=https://linea.dongrielabs.com/">
          <script>
          var p = location.pathname.replace(/^\/Linea/i, "") || "/";
          location.replace("https://linea.dongrielabs.com" + p + location.search + location.hash);
          </script>
          </head>
          <body>
          <p>A Linea mudou para <a href="https://linea.dongrielabs.com/">linea.dongrielabs.com</a>.</p>
          </body>
          </html>
          HTML
          cp out/index.html out/404.html
          touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
